# wallstreet-tieling multi-datasource template
# Version: 0.5.0
#
# Purpose
# - Give non-technical users a clean default-safe starting point.
# - Keep every endpoint user-configurable.
# - Run startup connectivity checks where a source can be checked safely.
# - Keep auth, token, session, signing, and challenge handling in config.
# - Do not store tokens, cookies, passwords, or private endpoints in this file.

version: "2.0"

sources:
  # Public REST API example. Enabled so a fresh install can prove the framework
  # loads, pings, queries, and normalizes records without credentials.
  - name: "github_public_api"
    type: "rest_api"
    enabled: true
    priority: 10
    base_url: "https://api.github.com"
    timeout: 30
    description: "Public REST source example. Use for connectivity and routing smoke tests."
    headers:
      Accept: "application/vnd.github+json"
      User-Agent: "wallstreet-tieling/0.5.0"
    params:
      per_page: 30
    auth:
      type: "none"
    ping: true
    ping_endpoint: "https://api.github.com/rate_limit"
    ping_timeout: 5
    auto_disable_on_fail: true
    rate_limit:
      enabled: true
      requests_per_second: 5.0
      burst_size: 5
    retry:
      max_retries: 2
      backoff_factor: 1.0
      retry_on_status: [429, 500, 502, 503, 504]
    cache_enabled: true
    cache_ttl: 300
    custom:
      evidence_role: "connectivity_smoke"
      source_legitimacy: "public_api"

  # Self-hosted SearXNG example for public web search fan-out.
  # Disabled by default because users must provide their own endpoint.
  - name: "public_web_search_searxng"
    type: "rest_api"
    enabled: false
    priority: 20
    base_url: "https://search.example.com"
    timeout: 20
    description: "Self-hosted SearXNG JSON endpoint for public web search."
    headers:
      Accept: "application/json"
      User-Agent: "wallstreet-tieling/0.5.0"
    params:
      format: "json"
      language: "auto"
    auth:
      type: "none"
    ping: true
    ping_endpoint: "https://search.example.com"
    ping_timeout: 5
    auto_disable_on_fail: true
    rate_limit:
      enabled: true
      requests_per_second: 1.0
      burst_size: 2
    retry:
      max_retries: 2
      backoff_factor: 1.0
      retry_on_status: [429, 500, 502, 503, 504]
    cache_enabled: true
    cache_ttl: 600
    custom:
      provider_type: "searxng"
      evidence_role: "public_web_lead"
      source_legitimacy: "public_web"
      requires_url_verification: true

  # Official global LEI data. Useful for legal-entity identity, addresses,
  # registration authority IDs, and parent/relationship links.
  - name: "gleif_lei_public_api"
    type: "rest_api"
    enabled: false
    priority: 21
    base_url: "https://api.gleif.org/api/v1"
    timeout: 25
    description: "GLEIF public LEI API for legal-entity identity and relationship records."
    headers:
      Accept: "application/vnd.api+json"
      User-Agent: "wallstreet-tieling/0.5.0"
    auth:
      type: "none"
    ping: true
    ping_endpoint: "https://api.gleif.org/api/v1/lei-records"
    ping_timeout: 5
    auto_disable_on_fail: true
    rate_limit:
      enabled: true
      requests_per_second: 1.0
      burst_size: 2
    retry:
      max_retries: 2
      backoff_factor: 1.0
      retry_on_status: [429, 500, 502, 503, 504]
    cache_enabled: true
    cache_ttl: 3600
    custom:
      provider_type: "gleif_lei"
      evidence_role: "official_entity_identity"
      source_legitimacy: "official_public_api"
      coverage_domains:
        - "corporate_registry"
        - "ownership_control"
        - "related_entities"
      controller_relevance: "parent_relationship_and_registration_authority_leads"
      provenance_required: true

  # U.S. SEC EDGAR public data API. The connector must use a descriptive
  # User-Agent and fair-access pacing when enabled.
  - name: "sec_edgar_public_api"
    type: "rest_api"
    enabled: false
    priority: 22
    base_url: "https://data.sec.gov"
    timeout: 25
    description: "SEC EDGAR public APIs for submissions and XBRL company facts."
    headers:
      Accept: "application/json"
      User-Agent: "wallstreet-tieling/0.5.0 contact@example.invalid"
    auth:
      type: "none"
    ping: true
    ping_endpoint: "https://data.sec.gov/submissions/CIK0000320193.json"
    ping_timeout: 5
    auto_disable_on_fail: true
    rate_limit:
      enabled: true
      requests_per_second: 0.2
      burst_size: 1
    retry:
      max_retries: 2
      backoff_factor: 2.0
      retry_on_status: [429, 500, 502, 503, 504]
    cache_enabled: true
    cache_ttl: 3600
    custom:
      provider_type: "sec_edgar"
      evidence_role: "official_public_company_disclosure"
      source_legitimacy: "official_public_api"
      coverage_domains:
        - "corporate_registry"
        - "financing_capital_markets"
        - "ownership_control"
        - "related_entities"
      controller_relevance: "officer_owner_filing_and_related_party_disclosure_leads"
      provenance_required: true

  # OpenSanctions bulk metadata is public; API screening/search may require an
  # API key. Keep the default source as a dataset catalog entry.
  - name: "opensanctions_public_dataset_catalog"
    type: "rest_api"
    enabled: false
    priority: 23
    base_url: "https://data.opensanctions.org"
    timeout: 25
    description: "OpenSanctions public dataset catalog for sanctions, PEP, and related-entity coverage metadata."
    headers:
      Accept: "application/json"
      User-Agent: "wallstreet-tieling/0.5.0"
    auth:
      type: "none"
    ping: true
    ping_endpoint: "https://data.opensanctions.org/datasets/latest/index.json"
    ping_timeout: 5
    auto_disable_on_fail: true
    rate_limit:
      enabled: true
      requests_per_second: 0.5
      burst_size: 1
    retry:
      max_retries: 2
      backoff_factor: 2.0
      retry_on_status: [429, 500, 502, 503, 504]
    cache_enabled: true
    cache_ttl: 43200
    custom:
      provider_type: "opensanctions_dataset_catalog"
      evidence_role: "watchlist_and_pep_dataset_catalog"
      source_legitimacy: "public_dataset_catalog"
      coverage_domains:
        - "people"
        - "related_entities"
        - "administrative_risk"
        - "ownership_control"
      controller_relevance: "controller_and_related_person_watchlist_screening_catalog"
      api_depth_requires_user_key: true
      provenance_required: true

  # Official U.S. Treasury OFAC consolidated sanctions list. This is a public
