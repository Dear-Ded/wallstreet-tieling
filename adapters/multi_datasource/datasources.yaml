    priority: 24
    base_url: "https://www.treasury.gov/ofac/downloads/consolidated"
    timeout: 30
    description: "U.S. Treasury OFAC consolidated sanctions XML for public watchlist screening."
    headers:
      Accept: "text/xml,application/xml"
      User-Agent: "wallstreet-tieling/0.5.0"
    auth:
      type: "none"
    ping: true
    ping_endpoint: "https://www.treasury.gov/ofac/downloads/consolidated/consolidated.xml"
    ping_timeout: 10
    auto_disable_on_fail: true
    rate_limit:
      enabled: true
      requests_per_second: 0.1
      burst_size: 1
    retry:
      max_retries: 2
      backoff_factor: 2.0
      retry_on_status: [429, 500, 502, 503, 504]
    cache_enabled: true
    cache_ttl: 86400
    custom:
      provider_type: "ofac_consolidated_xml"
      evidence_role: "official_watchlist_screening"
      source_legitimacy: "official_public_dataset"
      coverage_domains:
        - "administrative_risk"
        - "people"
        - "related_entities"
      controller_relevance: "controller_and_related_entity_watchlist_screening"
      provenance_required: true

  # United Nations Security Council consolidated sanctions list. Official
