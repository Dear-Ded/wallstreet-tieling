      type: "none"
    ping: true
    ping_endpoint: "https://scsanctions.un.org/resources/xml/en/consolidated.xml"
    ping_timeout: 10
    auto_disable_on_fail: true
    rate_limit:
      enabled: true
      requests_per_second: 0.1
      burst_size: 1
