name: Validate SKILL.md
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8
      - name: Check frontmatter
        run: |
          head -1 SKILL.md | grep -q '^---$'
          echo "Frontmatter OK"
      - name: Check sub-skills exist
        run: |
          count=$(find sub-skills -maxdepth 1 -name '*.md' ! -name 'aesthetic-design-system.md' | wc -l)
          if [ "$count" -eq 13 ]; then
            echo "13 role sub-skills OK"
          else
            echo "Expected 13 role sub-skills, found $count"
            exit 1
          fi
      - name: Check no stale public version markers
        run: |
          ! grep -Ern "12人|12 agents|50\+|v2\.0\.|v3\.0\." --include="*.md" --include="*.json" . | grep -v ".git\|CHANGELOG"
          echo "No stale data found OK"
      - name: Check release terminology
        run: |
          python bin/terminology_guard.py --fail-on error
      - name: Check release hygiene
        run: |
          python -m pytest tests/unit/test_release_hygiene.py tests/unit/test_terminology_guard.py -q
      - name: Check data protocol exists
        run: |
          test -f references/data-protocol.md
          echo "Protocol OK"
      - name: Check tests exist
        run: |
          test -f tests/regression.json
          echo "Tests OK"
      - name: Check release contract and static workbench script
        run: |
          python -m pytest tests/unit/test_release_variants.py -q
          node -e "const fs=require('fs'),vm=require('vm'); const s=fs.readFileSync('index.html','utf8'); const m=s.match(/<script>([\s\S]*)<\/script>/); if(!m) throw new Error('missing inline script'); new vm.Script(m[1]); console.log('static workbench script OK')"
      - name: Python syntax check
        run: |
          python -m compileall api/ core/ tests/
      - name: Python compatibility lint
        run: |
          python -m flake8 api/ core/ tests/ --select=E999,F821,F822,F823,F831 --max-line-length=120
      - name: Markdown lint release-facing docs
        run: |
          npm install -g markdownlint-cli
          markdownlint \
            SKILL.md \
            skills/wallstreet-tieling/SKILL.md \
            docs/AGENT_HOST_SMOKE_CHECKLIST.md \
            docs/DESKTOP_AGENT_ALPHA_DELIVERY.md \
            docs/DESKTOP_AGENT_HOSTS.md \
            docs/OPEN_AGENT_COMPATIBILITY.md \
            --disable MD013
