name: wallstreet-tieling CI

on:
  push:
    branches: [master, main]
    paths:
      - 'api/**'
      - 'adapters/**'
      - 'bin/**'
      - 'config/**'
      - 'core/**'
      - 'deploy/**'
      - 'docs/**'
      - 'index.html'
      - 'lib/**'
      - 'package.json'
      - 'references/**'
      - 'release/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install --ignore-scripts

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short

      - name: Run release terminology guard
        run: |
          python bin/terminology_guard.py --fail-on error

      - name: Run release hygiene guard
        run: |
          python -m pytest tests/unit/test_release_hygiene.py tests/unit/test_terminology_guard.py -q

      - name: Run offline risk graph smoke
        run: |
          python bin/risk_graph.py "Demo Technology Co., Ltd." --offline-fixture

      - name: Run one-click investigation packet smoke
        run: |
          python bin/investigate.py "Demo Technology Co., Ltd." --fixture-pack

      - name: Check static workbench script
        run: |
          node -e "const fs=require('fs'),vm=require('vm'); const s=fs.readFileSync('index.html','utf8'); const m=s.match(/<script>([\s\S]*)<\/script>/); if(!m) throw new Error('missing inline script'); new vm.Script(m[1]); console.log('static workbench script OK')"

      - name: Run connector audit smoke
        run: |
          python bin/connector_audit.py --production-ready

      - name: Run adapter readiness audit smoke
        run: |
          python bin/adapter_audit.py --needs-work

      - name: Run connector bridge smoke tests
        run: |
          python -m pytest tests/unit/test_public_web_search_tool.py tests/unit/test_telegram_public_service_tool.py -q

      - name: Run datasource auth smoke tests
        run: |
          python -m pytest tests/unit/test_auth_handlers.py -q

      - name: Run API graph endpoint smoke tests
        run: |
          python -m pytest tests/unit/test_api_server.py -q

      - name: Check MCP server syntax, package metadata, and packaged MCP smoke
        run: |
          node --check lib/mcp-server.js
          node -e "for (const f of ['package.json','deploy/mcp-server.json','.codex-plugin/plugin.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('plugin metadata OK')"
          npm run codex:mcp-smoke

      - name: Check import integrity
        run: |
          python -c "from api import Orchestrator, QualityRules, AgentRegistry, DueDiligenceAgent"
          echo "All core imports OK"
