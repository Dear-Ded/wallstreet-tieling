      - "docs/DESKTOP_AGENT_HOSTS.md"
      - "docs/OPEN_AGENT_COMPATIBILITY.md"
      - "docs/AGENT_HOST_SMOKE_CHECKLIST.md"
      - "deploy/multi-platform-guide.md"
    packaging:
      - "Repository instruction pack"
      - "Skill prompt"
      - "CLI tool"
      - "MCP server"
      - "REST API"
    required_capabilities:
      - "Host-neutral instructions without marketplace assumptions"
      - "MCP or CLI fallback execution"
      - "Structured packet and report parsing"
      - "No dependency on polished HTML UI"
    readiness: "alpha"
    next_gate:
      - "Keep open-source agent smoke checklist covering CLI, MCP, and API modes"
