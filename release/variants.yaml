      - "docs/CLAUDE_PROJECT_KNOWLEDGE_PACK.md"
      - "deploy/mcp-server.json"
      - "docs/DESKTOP_AGENT_HOSTS.md"
      - "docs/AGENT_HOST_SMOKE_CHECKLIST.md"
    packaging:
      - "Claude Code repo instructions"
      - "Claude Project knowledge pack"
      - "MCP-friendly deployment notes"
    required_capabilities:
      - "Repo handoff instructions"
      - "Skill prompt fallback"
      - "MCP connector mapping"
      - "No browser cookies or tokens in repo"
    readiness: "alpha"
    next_gate:
      - "Keep Claude Code host smoke checklist aligned with MCP connector_catalog, release_readiness, development_requirements, and agent_tool_adapters"
      - "Keep Claude Project knowledge-pack bundle aligned with runtime handoffs"
      - "Keep Claude-specific CI smoke checklist mapped to shared agent host smoke"

  hermes:
    display_name: "Hermes"
    audience: "Hermes-style desktop/coding agents that consume repository prompts, CLI tools, and MCP-compatible local services."
    entrypoints:
      - "SKILL.md"
      - "bin/cli.js"
      - "deploy/mcp-server.json"
      - "docs/API_CONTRACTS.md"
      - "docs/DESKTOP_AGENT_HOSTS.md"
      - "docs/HERMES_AGENT_SETUP.md"
      - "docs/AGENT_HOST_SMOKE_CHECKLIST.md"
      - "deploy/multi-platform-guide.md"
    packaging:
      - "Skill prompt"
      - "CLI tool"
      - "MCP deployment manifest"
      - "API contract notes"
    required_capabilities:
