  workbuddy_expert_team:
    display_name: "WorkBuddy Expert Team"
    audience: "WorkBuddy/OpenClaw/CodeBuddy users who want the 13-role expert-team workflow."
    delivery_priority:
      lane: "secondary"
      rank: 20
      reason: "WorkBuddy expert-team mode follows Codex mainline delivery and must not displace Codex adaptation work."
      depends_on:
        - "codex"
    project_branch:
      branch_id: "workbuddy_expert_team"
      branch_type: "expert_team_host_adapter"
      owns:
        - "WorkBuddy persona/tool routing"
        - "13-role expert-team handoff"
        - "WorkBuddy-specific fallback instructions"
      must_not_touch:
        - "core runtime architecture"
        - "source admission policy"
        - "release truth source"
        - "production HTML UI"
      shared_runtime_contract:
        - "release_readiness"
        - "connector_catalog"
        - "development_requirements"
        - "agent_tool_adapters"
        - "investigate_company"
    entrypoints:
      - "adapters/workbuddy.py"
      - "SKILL.md"
      - "docs/DESKTOP_AGENT_HOSTS.md"
      - "docs/AGENT_HOST_SMOKE_CHECKLIST.md"
      - "sub-skills/"
    packaging:
      - "WorkBuddy skill"
      - "Expert-team adapter"
    required_capabilities:
      - "13-role routing"
      - "WorkBuddy tool delegation"
      - "Multi-source adapter fallback"
      - "Output persistence"
    readiness: "alpha"
    next_gate:
      - "Keep WorkBuddy host smoke checklist aligned with connector_catalog, release_readiness, development_requirements, agent_tool_adapters, and investigate_company"
      - "Keep expert-team mode smoke test mapped to tests/unit/test_workbuddy.py"
      - "Document host tool delegation, investigation packet routing, and fallback behavior"

release_gates:
  public_claims:
    - "Every public feature claim must map to an entrypoint, test, or roadmap item."
    - "Verified data-source claims must distinguish live, configured, planned, and fallback sources."
    - "Marketing language must not imply private-data scraping or unauthorized access."
  security:
    - "No API keys, PATs, cookies, browser profiles, local SQLite collaboration databases, or generated secrets."
    - "Credentials must come from environment variables or user-authorized host integrations."
    - "Personal/social-web clues remain leads until corroborated by public or authorized sources."
  quality:
    - "Focused tests pass for touched surfaces."
    - "npm run acceptance passes before release claims are updated."
    - "Desktop-agent entrypoints expose equivalent release_readiness, connector_catalog, development_requirements, agent_tool_adapters, and investigate_company behavior."
    - "Agent-readable outputs include Markdown and JSON packet forms without requiring the polished HTML workbench."
    - "A release-readiness document exists for each marketplace or host submission."
    - "Core outputs include evidence gaps instead of fabricated facts."
