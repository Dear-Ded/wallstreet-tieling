product:
  name: wallstreet-tieling
  display_name: "Wallstreet Tieling"
  positioning: "Enterprise Intelligence & Risk Discovery System"
  public_portal_repo: "https://github.com/Dear-Ded/wallstreet-tieling"
  signature_features:
    - "13-role anthropomorphic expert-team surface"
    - "Anthropomorphic shell and persona-consistent product framing"
    - "Broad public-or-authorized evidence retrieval"
    - "Evidence graph, risk-event, and report/export surfaces"
    - "Desktop-agent first delivery; polished HTML, mini-program, app, and desktop app are later-version targets"
    - "Continuous monitoring is a later-version target"
  shared_core:
    - core.engine.Engine
    - core.enterprise_cognition.EnterpriseCognitionEngine
    - core.intelligence_retrieval.InvestigativeRetrievalPlanner
    - core.risk_event_store.RiskEventStore
    - core.financial_analyzer_v2.EnhancedFinancialAnalyzer
    - core.industry_intelligence.IndustryIntelligenceEngine
    - core.product_intelligence.ProductIntelligenceEngine

variants:
  universal:
    display_name: "Universal"
    audience: "Any desktop agent, coding agent, terminal agent, or automation host that can run the CLI, REST API, MCP server, Docker image, or copy the skill prompt."
    entrypoints:
      - "SKILL.md"
      - "bin/cli.js"
      - "api/server.py"
      - "adapters/cli.py"
      - "deploy/mcp-server.json"
      - "docs/DESKTOP_AGENT_HOSTS.md"
      - "docs/AGENT_HOST_SMOKE_CHECKLIST.md"
    packaging:
      - "npm package"
      - "Docker image"
      - "REST API"
      - "MCP server"
      - "copy/paste skill prompt"
    required_capabilities:
      - "Company investigation planning"
      - "Evidence-first report generation"
      - "Enterprise cognition profile"
      - "Risk event ledger"
      - "Agent-readable JSON and Markdown packet outputs"
    readiness: "alpha"
    next_gate:
      - "Keep host smoke green across CLI, REST API, and MCP entrypoints"
      - "Keep host-neutral agent packet acceptance for JSON, Markdown, portable HTML, and DOCX renderer metadata"

  codex:
    display_name: "Codex"
    audience: "Codex users, Codex plugin marketplace, and repo-maintenance workflows."
    delivery_priority:
      lane: "primary"
      rank: 1
      reason: "Codex plugin and Codex skill delivery are the current mainline release target."
    entrypoints:
      - ".codex-plugin/plugin.json"
      - "skills/wallstreet-tieling/SKILL.md"
      - "bin/retrieval_plan.py"
      - "docs/DESKTOP_AGENT_HOSTS.md"
      - "docs/CODEX_MARKETPLACE_SUBMISSION_NOTES.md"
      - "docs/PLUGIN_MARKET_READINESS.md"
    packaging:
      - "Codex plugin"
      - "Codex skill"
    required_capabilities:
      - "Plugin manifest validation"
      - "Marketplace-safe skill metadata"
      - "Repo development handoff workflow"
      - "No secrets in plugin files"
    readiness: "alpha"
    next_gate:
      - "Keep Codex CI workflow green for packaged MCP smoke and host-neutral desktop-agent smoke"
      - "Keep packaged MCP smoke in acceptance for connector_catalog, release_readiness, development_requirements, agent_tool_adapters, retrieval_plan, and investigate_company"
      - "Keep Codex smoke workflow covering retrieval plan and cognition profile"
      - "Capture marketplace submission screenshots after final acceptance pass"

  claude_code:
    display_name: "Claude Code"
    audience: "Claude Code and Claude Project users who consume repository instructions and MCP-friendly assets."
