release_gates:
  public_claims:
    - "Every public feature claim must map to an entrypoint, test, or roadmap item."
    - "Verified data-source claims must distinguish live, configured, planned, and fallback sources."
    - "Marketing language must not imply private-data scraping or unauthorized access."
  security:
    - "No API keys, PATs, cookies, browser profiles, local SQLite collaboration databases, or generated secrets."
    - "Credentials must come from environment variables or user-authorized host integrations."
    - "Personal/social-web clues remain leads until corroborated by public or authorized sources."
  quality:
    - "Focused tests pass for touched surfaces."
    - "npm run acceptance passes before release claims are updated."
    - "Desktop-agent entrypoints expose equivalent release_readiness, connector_catalog, and investigate_company behavior."
    - "Agent-readable outputs include Markdown and JSON packet forms without requiring the polished HTML workbench."
    - "A release-readiness document exists for each marketplace or host submission."
    - "Core outputs include evidence gaps instead of fabricated facts."
