      - "Office-agent readable Markdown output"
      - "Evidence ledger and next-action extraction"
      - "Default-safe public or user-authorized source policy"
    readiness: "alpha"
    next_gate:
      - "Keep office-task prompt smoke checklist aligned with default public investigation output"
