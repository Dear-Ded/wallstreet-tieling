product:
  name: wallstreet-tieling
  display_name: "Wallstreet Tieling"
  positioning: "Enterprise Intelligence & Risk Discovery System"
  public_portal_repo: "https://github.com/Dear-Ded/wallstreet-tieling"
  signature_features:
    - "13-role anthropomorphic expert-team surface"
    - "Anthropomorphic shell and persona-consistent product framing"
    - "Broad public-or-authorized evidence retrieval"
    - "Evidence graph, risk-event, and report/export surfaces"
    - "Desktop-agent first delivery; polished HTML, mini-program, app, and desktop app are later-version targets"
    - "Continuous monitoring is a later-version target"
  shared_core:
    - core.engine.Engine
    - core.enterprise_cognition.EnterpriseCognitionEngine
    - core.intelligence_retrieval.InvestigativeRetrievalPlanner
    - core.risk_event_store.RiskEventStore
    - core.financial_analyzer_v2.EnhancedFinancialAnalyzer
    - core.industry_intelligence.IndustryIntelligenceEngine
    - core.product_intelligence.ProductIntelligenceEngine

variants:
  universal:
    display_name: "Universal"
    audience: "Any desktop agent, coding agent, terminal agent, or automation host that can run the CLI, REST API, MCP server, Docker image, or copy the skill prompt."
    entrypoints:
      - "SKILL.md"
      - "bin/cli.js"
      - "api/server.py"
      - "adapters/cli.py"
      - "deploy/mcp-server.json"
      - "docs/DESKTOP_AGENT_HOSTS.md"
    packaging:
      - "npm package"
      - "Docker image"
      - "REST API"
      - "MCP server"
      - "copy/paste skill prompt"
    required_capabilities:
      - "Company investigation planning"
      - "Evidence-first report generation"
      - "Enterprise cognition profile"
      - "Risk event ledger"
      - "Agent-readable JSON and Markdown packet outputs"
    readiness: "alpha"
    next_gate:
      - "Run host smoke across CLI, REST API, and MCP entrypoints"
      - "Add host-neutral agent packet acceptance for JSON and Markdown outputs"

  codex:
