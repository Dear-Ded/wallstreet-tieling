<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Wallstreet Tieling brand card</title>
  <desc id="desc">A decorative brand card for an evidence-first due-diligence runtime with an anthropomorphic expert team.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07110f"/>
      <stop offset="0.52" stop-color="#14332d"/>
      <stop offset="1" stop-color="#d7b46a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="60%">
      <stop offset="0" stop-color="#f8e8b1" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#f8e8b1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="34" fill="url(#bg)"/>
  <rect x="32" y="32" width="1216" height="356" rx="26" fill="#ffffff" opacity="0.075"/>
  <circle cx="1014" cy="94" r="270" fill="url(#glow)"/>
  <path d="M84 314 C190 246 236 260 328 188 C410 124 520 128 620 168 C738 215 793 302 935 262 C1032 235 1100 159 1194 132" fill="none" stroke="#f9d77e" stroke-width="4" stroke-linecap="round" opacity="0.82"/>
  <path d="M84 340 C178 294 251 314 359 250 C460 191 551 202 653 236 C770 275 837 340 970 314 C1069 294 1132 242 1194 210" fill="none" stroke="#b7f7dd" stroke-width="2" stroke-linecap="round" opacity="0.58"/>
  <g filter="url(#shadow)">
    <rect x="92" y="82" width="276" height="214" rx="24" fill="#f8fafc" opacity="0.94"/>
    <text x="126" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#0f2f29">Evidence</text>
    <text x="126" y="179" font-family="Arial, sans-serif" font-size="20" fill="#31534b">ledger / source / graph</text>
    <text x="126" y="223" font-family="Arial, sans-serif" font-size="18" fill="#456860">facts, leads, confidence</text>
    <rect x="126" y="248" width="184" height="10" rx="5" fill="#c49a3a"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="450" y="112" width="336" height="238" rx="28" fill="#08251f" opacity="0.92"/>
    <text x="492" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#f8e8b1">13-role team</text>
    <text x="492" y="211" font-family="Arial, sans-serif" font-size="22" fill="#d5f8e9">anthropomorphic experts</text>
    <text x="492" y="256" font-family="Arial, sans-serif" font-size="18" fill="#a9d8ca">route, verify, explain, hand off</text>
    <circle cx="708" cy="292" r="18" fill="#f8e8b1"/>
    <circle cx="659" cy="292" r="18" fill="#8be2c1"/>
    <circle cx="610" cy="292" r="18" fill="#d7b46a"/>
    <circle cx="561" cy="292" r="18" fill="#f8fafc"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="875" y="74" width="312" height="250" rx="28" fill="#fff8e5" opacity="0.94"/>
    <text x="918" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#132f29">Tieling Desk</text>
    <text x="918" y="176" font-family="Arial, sans-serif" font-size="21" fill="#39564f">Wall Street standard</text>
    <text x="918" y="224" font-family="Arial, sans-serif" font-size="18" fill="#5d5140">desktop-agent due diligence</text>
    <text x="918" y="256" font-family="Arial, sans-serif" font-size="18" fill="#5d5140">printable, auditable, repeatable</text>
  </g>
  <text x="84" y="374" font-family="Arial, sans-serif" font-size="20" fill="#f8fafc" opacity="0.88">Input a subject. Get the desk, the ledger, the graph, and the next move.</text>
</svg>
